[package]
name = "interviewr-ai"
version = "0.1.1"
description = "Real-time interview and meeting copilot"
edition = "2021"
rust-version = "1.77"

[lib]
name = "overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
getrandom = "0.3"
# Wayland global shortcuts: the XDG portal, since global-hotkey (under
# tauri-plugin-global-shortcut) is X11-only. See src/shortcuts.rs.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "rt", "net", "time"] }
# Claiming our own systemd app scope, which is what gives the portal an app id. Already in the
# tree via ashpd. See src/appid.rs.
zbus = { version = "5", default-features = false, features = ["tokio"] }
