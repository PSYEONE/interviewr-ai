[package]
name = "interviewr-overlay"
version = "0.1.0"
description = "interviewr-ai overlay (primary UI client)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
