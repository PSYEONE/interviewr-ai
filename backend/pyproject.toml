[project]
name = "interviewr-ai"
version = "0.1.1"
description = "Linux-first, privacy-first real-time interview/meeting copilot"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "numpy",
    "pypdf",
    "python-docx",
]

[project.optional-dependencies]
local = [
    "pywhispercpp",
]
cloud = [
    "anthropic",
    "google-genai",
    "openai",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "jiwer",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default run stays offline and deterministic; -m network opts into the freshness checks.
addopts = "-m 'not network'"
markers = ["network: reaches the internet (catalog freshness); excluded by default"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

# Cloud SDKs are optional extras; don't fail strict typing when they aren't installed.
# python-docx ships no type stubs, so treat it the same way.
[[tool.mypy.overrides]]
module = ["google.*", "openai.*", "anthropic.*", "docx.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
