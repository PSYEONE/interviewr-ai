[project]
name = "interviewr-ai"
version = "0.0.0"
description = "Linux-first, privacy-first real-time interview/meeting copilot"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
local = [
    "pywhispercpp",
]
cloud = [
    "anthropic",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
