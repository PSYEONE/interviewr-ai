name: Feedback on an answer
description: The app's answer was unhelpful, wrong in tone, or missed the question
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        This is for how the app answers: the default prompts and the answer styles are a starting
        point, and reports like this are how they improve. For crashes and things that don't work,
        use the bug report instead.

  - type: textarea
    id: question
    attributes:
      label: The question, as the app heard it
      description: Copy it from the transcript. Leave out anything private.
    validations:
      required: true

  - type: textarea
    id: answer
    attributes:
      label: What the app answered, and what was wrong with it
      description: Too long, wrong focus, ignored the CV, missed the question, or anything else.
    validations:
      required: true

  - type: textarea
    id: better
    attributes:
      label: What a good answer would have looked like
      description: A sketch is enough. If you changed the system prompt or answer style and it helped, paste that.

  - type: input
    id: model
    attributes:
      label: Model in use
      placeholder: qwen2.5:7b on Ollama, claude-opus-4-8, gemini-2.5-flash
