name: Refresh model catalog

# The curated list lives in hardware.py; this only regenerates the facts in catalog.json and
# commits routine drift straight to main. The run goes red instead of committing when a tag no
# longer resolves or a size jumps by a re-quantisation's worth (--strict); the log says which.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install httpx and pydantic
        run: pip install httpx pydantic pydantic-settings

      - name: Regenerate catalog.json
        working-directory: backend
        run: python scripts/refresh_catalog.py --strict

      - name: Commit the catalog when it changed
        run: |
          if git diff --quiet -- backend/app/system/catalog.json; then
            echo "catalog unchanged; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/system/catalog.json
          git commit -m "refresh model catalog from the ollama registry"
          git push
